<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGA Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-96 text-center">
    <h2 class="text-2xl font-bold mb-4">Attendance System</h2>

    <input id="name" type="text" placeholder="Enter Name"
      class="w-full p-2 border rounded mb-4"/>

    <div class="flex gap-3">
      <button onclick="sendData('checkin')"
        class="bg-green-500 text-white px-4 py-2 rounded w-full">
        Check In
      </button>

      <button onclick="sendData('checkout')"
        class="bg-red-500 text-white px-4 py-2 rounded w-full">
        Check Out
      </button>
    </div>

    <p id="status" class="mt-4 text-sm text-gray-600"></p>
  </div>

<script>
const url = "https://script.google.com/macros/s/AKfycbwLUktp2OXp645KNq_nMGshDQ5EVwOJF3qZXB8tVYH2yoP3REiDyIhxuPauS4qJto0FDg/exec";

function sendData(action) {
  const name = document.getElementById("name").value;

  if (!name) {
    alert("Enter name first");
    return;
  }

  document.getElementById("status").innerText = "Processing...";

  fetch(url, {
    method: "POST",
    body: JSON.stringify({ name, action })
  })
  .then(res => res.text())
  .then(() => {
    document.getElementById("status").innerText = "Success ✅";
  })
  .catch(() => {
    document.getElementById("status").innerText = "Error ❌";
  });
}
</script>

</body>
</html>
